<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Set theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- Vendored locally (no runtime CDN); single Preact instance via this map. -->
  <script type="importmap">
    {
      "imports": {
        "preact": "/vendor/preact.module.js",
        "preact/hooks": "/vendor/hooks.module.js",
        "htm": "/vendor/htm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
